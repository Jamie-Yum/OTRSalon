<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>현장 질문 — 오프더레코드 살롱</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',sans-serif;background:#141414;color:#EDE6D6;min-height:100vh;min-height:100dvh;word-break:keep-all;-webkit-text-size-adjust:100%}
.w{max-width:520px;margin:0 auto;padding:2.2rem 1.25rem 3rem}
.wm{font-family:'Inter Tight',sans-serif;font-weight:800;letter-spacing:.02em;word-spacing:-.18em;font-size:.9rem}.wm .the{font-size:.66em}
.eb{font-family:'Inter Tight',sans-serif;font-size:.75rem;font-weight:600;letter-spacing:.22em;color:#C9B37E;margin:2.6rem 0 .6rem;text-transform:uppercase}
h1{font-size:1.9rem;font-weight:700;line-height:1.3}
.sub{color:rgba(237,230,214,.65);margin-top:.7rem;font-size:.95rem;line-height:1.65}
textarea{width:100%;min-height:170px;margin-top:1.8rem;background:#1E1E1E;border:1px solid rgba(237,230,214,.18);border-radius:14px;color:#EDE6D6;font:inherit;font-size:1.05rem;line-height:1.6;padding:1rem 1.1rem;resize:vertical;outline:none}
textarea:focus{border-color:#C9B37E}
.cnt{text-align:right;font-size:.78rem;color:rgba(237,230,214,.4);margin-top:.4rem}
button{width:100%;margin-top:1rem;background:#C9B37E;color:#141414;border:0;border-radius:999px;padding:1rem;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
button.gh{background:none;color:#EDE6D6;border:1px solid rgba(237,230,214,.3)}
.err{color:#E2A39B;margin-top:.8rem;font-size:.9rem}
.ok{margin-top:2.2rem;border:1px solid rgba(201,179,126,.4);border-radius:14px;padding:1.4rem 1.3rem;background:rgba(201,179,126,.08)}
.ok b{display:block;font-size:1.15rem;color:#E2CD94}.ok p{margin-top:.5rem;font-size:.92rem;color:rgba(237,230,214,.7);line-height:1.6}
.tip{margin-top:2rem;font-size:.78rem;color:rgba(237,230,214,.4);line-height:1.7}
</style></head><body>
<div class="w" id="app"><div class="wm">OFF <span class="the">THE</span> RECORD SALON</div><p class="sub" style="margin-top:2rem">불러오는 중…</p></div>
<script>
const SU='https://dvlrzbckneucpvlacdll.supabase.co',SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2bHJ6YmNrbmV1Y3B2bGFjZGxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5ODE0OTUsImV4cCI6MjA5MDU1NzQ5NX0.ofzGfyjndiT-FAIcG9TCFtUSXsagTBYOnhsP91vx0sE';
const C=new URLSearchParams(location.search).get('c'),$=id=>document.getElementById(id);
const esc=t=>(t==null?'':String(t)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const call=(fn,b)=>fetch(SU+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SK,Authorization:'Bearer '+SK,'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>{const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||r.status);return j;});
const WM='<div class="wm">OFF <span class="the">THE</span> RECORD SALON</div>';
let I=null;
function form(){$('app').innerHTML=`${WM}<div class="eb">Session 0${I.n} · Open Q&amp;A</div><h1>현장 질문 보내기</h1>
  <p class="sub">${I.speaker?esc(I.speaker)+' '+esc((I.role||'').split(' ').pop())+'님께 ':''}묻고 싶은 것을 자유롭게 적어 주세요.<br>이름 없이 보내지고, 화면에 바로 뜹니다.</p>
  ${I.open?`<textarea id="q" maxlength="300" placeholder="예) 가장 힘들었던 시기를 버티게 한 것은 무엇이었나요?" oninput="$('n').textContent=this.value.length+' / 300'"></textarea><div class="cnt" id="n">0 / 300</div>
  <button id="b" onclick="send()">보내기</button><p class="err" id="e"></p>`
  :`<div class="ok"><b>아직 질문을 받기 전입니다</b><p>질의응답 시간이 시작되면 열립니다. 잠시 후 다시 눌러 주세요.</p></div><button class="gh" onclick="load()">다시 확인하기</button>`}
  <p class="tip">Off the Record — 오늘 오간 이야기는 이 자리에 남겨 둡니다.</p>`;}
async function send(){const t=$('q').value.trim(),b=$('b');if(t.length<2){$('e').textContent='질문을 적어 주세요.';return;}
  b.disabled=true;b.textContent='보내는 중…';
  try{await call('otr_live_ask',{c:C,q:t});
    $('app').innerHTML=`${WM}<div class="ok"><b>질문이 전달되었습니다</b><p>${esc(t)}</p></div><button class="gh" onclick="load()">질문 더 보내기</button><p class="tip">Off the Record — 오늘 오간 이야기는 이 자리에 남겨 둡니다.</p>`;}
  catch(er){$('e').textContent=er.message;b.disabled=false;b.textContent='보내기';}}
async function load(){if(!C){$('app').innerHTML=WM+'<p class="sub err">주소가 올바르지 않습니다.</p>';return;}
  try{I=await call('otr_live_info',{c:C});form();}catch(er){$('app').innerHTML=WM+`<p class="sub err" style="margin-top:2rem">${esc(er.message)}</p>`;}}
load();
</script>
</body></html>
